# apps/monitoring/vector.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: default
data:
  vector.yaml: |
    data_dir: "/var/lib/vector"
    sources:
      kubernetes_logs:
        type: "kubernetes_logs"
    transforms:
      process_logs:
        type: "remap"
        inputs:
          - "kubernetes_logs"
        source: |
          ignored_namespaces = [
            "kube-system",
            "kube-public",
            "kube-node-lease",
            "local-path-storage"
          ]
          id, err = .kubernetes.namespace
          if err == null && contains(ignored_namespaces, id) {
            abort
          }
          if exists(.kubernetes.pod_labels.logging) {
            if .kubernetes.pod_labels.logging == "skip" {
              abort
            }
          }
          if msg, err = string(.message); err == null {
            if parsed, err = parse_json(msg); err == null {
              ., err = merge(., parsed)
              del(.message)
            }
          }
          del(.kubernetes.pod_ip)
          del(.kubernetes.pod_ips)
          del(.kubernetes.pod_owner)
          del(.kubernetes.pod_uid)
          del(.kubernetes.container_id)
          del(.kubernetes.container_image_id)
          del(.kubernetes.node_labels)
          del(.kubernetes.pod_node_name)
          del(.file)
    sinks:
      openobserve:
        type: "http"
        inputs:
          - "process_logs"
        uri: "http://openobserve:5080/api/default/default/_json"
        method: "post"
        auth:
          strategy: "basic"
          user: "${OO_ROOT_USER_EMAIL}"
          password: "${OO_ROOT_USER_PASSWORD}"
        compression: "gzip"
        encoding:
          codec: "json"
          timestamp_format: "rfc3339"
        healthcheck:
          enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: default
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.35.0-alpine
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OO_ROOT_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: homelab-secrets
                  key: OO_ROOT_USER_EMAIL
            - name: OO_ROOT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homelab-secrets
                  key: OO_ROOT_USER_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: data
              mountPath: /var/lib/vector
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
